apiVersion: batch/v1
kind: Job
metadata:
  name: stats-backfill
  namespace: ecommerce
spec:
  # Manual job: apply it explicitly when historical OLTP rows need to be
  # materialized into ClickHouse. Re-running is safe — event ids are
  # deterministic per source row, so ClickHouse ReplacingMergeTree dedups.
  backoffLimit: 3
  template:
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-deps
          image: busybox:1.35
          command: ["sh", "-c"]
          args:
            - |
              echo "[INIT] Waiting for MongoDB (ec_sales + ec_catalog) + ClickHouse..."
              until nc -z mongodb-sales.ecommerce.svc.cluster.local 27017 \
                && nc -z mongodb-catalog.ecommerce.svc.cluster.local 27017 \
                && nc -z clickhouse.ecommerce.svc.cluster.local 9000; do
                echo "Dependencies not ready yet. Retrying in 5 seconds..."
                sleep 5
              done
              echo "[INIT] All dependencies are ready!"
      containers:
        - name: stats-backfill
          image: ghcr.io/__GHCR_OWNER__/vertx-ecommerce/stats_writer:latest
          imagePullPolicy: IfNotPresent
          args: ["backfill"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: app-logs
              mountPath: /var/log/app
      volumes:
        - name: app-logs
          persistentVolumeClaim:
            claimName: app-logs-pvc
      restartPolicy: OnFailure
