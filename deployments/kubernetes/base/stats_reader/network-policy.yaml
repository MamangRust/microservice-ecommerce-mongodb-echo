apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stats-reader-netpol
  namespace: ecommerce
spec:
  podSelector:
    matchLabels:
      app: stats-reader
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ecommerce
      ports:
        - protocol: TCP
          port: 50070
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ecommerce
    # DNS resolution for outbound service names.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
