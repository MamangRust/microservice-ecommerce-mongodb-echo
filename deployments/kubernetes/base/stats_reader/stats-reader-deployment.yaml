apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats-reader
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stats-reader
  template:
    metadata:
      labels:
        app: stats-reader
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: init-log-permission
          image: busybox:1.35
          command: ["sh", "-c"]
          args:
            - |
              echo "[INIT] Setting ownership for /var/log/app"
              chown -R 1000:1000 /var/log/app
          volumeMounts:
            - name: app-logs
              mountPath: /var/log/app
          securityContext:
            runAsUser: 0

        - name: wait-for-clickhouse
          image: busybox:1.35
          command: ["sh", "-c"]
          args:
            - |
              echo "[INIT] Waiting for ClickHouse to be ready (TCP)..."
              until nc -z clickhouse.ecommerce.svc.cluster.local 9000; do
                echo "ClickHouse is not ready yet. Retrying in 5 seconds..."
                sleep 5
              done
              echo "[INIT] ClickHouse is ready!"
      containers:
        - name: stats-reader
          image: ghcr.io/__GHCR_OWNER__/vertx-ecommerce/stats_reader:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          ports:
            - containerPort: 50070

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          livenessProbe:
            tcpSocket:
              port: 50070
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 50070
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            tcpSocket:
              port: 50070
            failureThreshold: 30
            periodSeconds: 10
          volumeMounts:
            - name: app-logs
              mountPath: /var/log/app
      volumes:
        - name: app-logs
          persistentVolumeClaim:
            claimName: app-logs-pvc
