apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-experience
  namespace: ecommerce
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-experience
  namespace: ecommerce
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mongodb-experience
  template:
    metadata:
      labels:
        app: mongodb-experience
        tier: mongodb
    spec:
      # The official mongo image runs as uid/gid 999 (mongodb); fsGroup lets the
      # process write to the mounted PVC.
      securityContext:
        fsGroup: 999
      containers:
        - name: mongodb
          image: mongo:7
          imagePullPolicy: IfNotPresent
          ports:
            - name: mongo
              containerPort: 27017
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongodb-experience
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-experience
  namespace: ecommerce
spec:
  selector:
    app: mongodb-experience
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
  type: ClusterIP
