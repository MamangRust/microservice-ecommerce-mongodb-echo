apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats-writer
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stats-writer
  template:
    metadata:
      labels:
        app: stats-writer
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: init-log-permission
          image: busybox:1.35
          command: ["sh", "-c"]
          args:
            - |
              echo "[INIT] Setting ownership for /var/log/app"
              chown -R 1000:1000 /var/log/app
          volumeMounts:
            - name: app-logs
              mountPath: /var/log/app
          securityContext:
            runAsUser: 0

        - name: wait-for-kafka
          image: busybox:1.35
          command: ["sh", "-c"]
          args:
            - |
              echo "[INIT] Waiting for Kafka to be ready (TCP)..."
              until nc -z kafka.ecommerce.svc.cluster.local 9092; do
                echo "Kafka is not ready yet. Retrying in 5 seconds..."
                sleep 5
              done
              echo "[INIT] Kafka is ready!"

        - name: wait-for-clickhouse
          image: busybox:1.35
          command: ["sh", "-c"]
          args:
            - |
              echo "[INIT] Waiting for ClickHouse to be ready (TCP)..."
              until nc -z clickhouse.ecommerce.svc.cluster.local 9000; do
                echo "ClickHouse is not ready yet. Retrying in 5 seconds..."
                sleep 5
              done
              echo "[INIT] ClickHouse is ready!"
      containers:
        # stats-writer exposes no health endpoint (it is a Kafka consumer
        # with no HTTP/gRPC server), so it has no ports and no probes.
        - name: stats-writer
          image: ghcr.io/__GHCR_OWNER__/vertx-ecommerce/stats_writer:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: app-logs
              mountPath: /var/log/app
      volumes:
        - name: app-logs
          persistentVolumeClaim:
            claimName: app-logs-pvc
