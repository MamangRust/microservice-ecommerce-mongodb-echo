apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: migrate-netpol
  namespace: ecommerce
spec:
  # Job migrate hanya butuh egress ke keenam instance MongoDB + DNS; tidak ada
  # ingress sama sekali.
  podSelector:
    matchLabels:
      app: migrate
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              tier: mongodb
      ports:
        - protocol: TCP
          port: 27017
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
