  apigateway:
    image: apigateway-ecommerce-service:1.0
    container_name: apigateway-ecommerce
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ./logs:/var/log/app
      - ./uploads:/app/uploads
    ports:
      - "5000:5000"
    networks:
      - app_ecommerce_network
    depends_on:
      kafka:
        condition: service_healthy
      auth:
        condition: service_started
      role:
        condition: service_started
      user:
        condition: service_started
      category:
        condition: service_started
      merchant:
        condition: service_started
      order-item:
        condition: service_started
      order:
        condition: service_started
      product:
        condition: service_started
      transaction:
        condition: service_started
      cart:
        condition: service_started
      review:
        condition: service_started
      slider:
        condition: service_started
      shipping_address:
        condition: service_started
      banner:
        condition: service_started
      merchant_award:
        condition: service_started
      merchant_business:
        condition: service_started
      merchant_detail:
        condition: service_started
      merchant_policy:
        condition: service_started
      review_detail:
        condition: service_started
      stats_reader:
        condition: service_started
    environment:
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - GRPC_STATS_READER_ADDR=stats_reader:50070

  auth:
    image: auth-ecommerce-service:1.0
    container_name: auth-ecommerce
