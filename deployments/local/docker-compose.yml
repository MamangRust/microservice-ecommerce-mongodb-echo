      - ./logs:/var/log/app
    networks:
      - app_ecommerce_network
    depends_on:
      mongodb_identity:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis:
        condition: service_started
    environment:
      - MONGO_IDENTITY_URI=mongodb://mongodb_identity:27017
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092

