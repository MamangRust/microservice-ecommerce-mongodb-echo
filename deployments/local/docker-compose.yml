name: ecommerce-mongo-local

services:
  # 1 database = 1 MongoDB. Enam bounded context, enam server standalone.
  # Tidak ada replica set dan tidak ada mongodb-init.
  mongodb_identity:
    image: mongo:7
    container_name: ecommerce-mongodb-identity
    ports:
      - "27017:27017"
    volumes:
      - mongodb_identity_data:/data/db
    networks:
      - app_ecommerce_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: ["--bind_ip_all"]

  mongodb_catalog:
    image: mongo:7
    container_name: ecommerce-mongodb-catalog
    ports:
      - "27018:27017"
    volumes:
      - mongodb_catalog_data:/data/db
